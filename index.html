const NOTES_DATA = {"2026-05-17": {"theme": "misc", "topics": ["연구노트 자동화 시스템", "UI/UX 개선", "브라우저 캐시 문제 해결", "GitHub Pages 배포", "PWA 모바일 앱화"], "summary_3lines": ["일일 연구노트 자동화 시스템 UI 전면 개편 — 테마 색상, 주간목표 컬럼, 모달 헤더 완성", "GitHub Pages + PWA 배포로 웹/모바일 어디서나 접근 가능한 연구노트 앱 완성", "Service Worker Network-first 캐싱으로 퇴근 후 자동 업데이트 완료, 캐시 삭제 불필요"], "qa_highlights": [{"q_original": "어제자 내용은 하나도 정리가 안됐는데 어제자 내용도 추가해주고 아래 사항을 수정 및 보완해줘\n1. UI/UX 전문가로서 연구노트 페이지를 보기 좋게 정리\n2. 테마별 색상 구분 (호흡-분홍, 초음파-연두, 수면-보라, 기타-회색)\n3. 연구노트 상단에 날짜/출퇴근 시간/일일목표/3줄요약 추가\n4. 캘린더에 일주일 목표 컬럼 추가", "a_summary": "HTML 템플릿 개편으로 모달 헤더에 출퇴근 시각과 일일목표 표시, 테마별 색상 적용, 주간목표 컬럼 추가. generate_note.py에 theme 필드와 summary_3lines 추가, 훅에서 출근 메시지 파싱해 daily_goal 추출.", "a_original": "변경 목록:\n1. `generate_note.py` — theme/summary_3lines/daily_goal 필드, 새 HTML 템플릿 (weekly goal 컬럼, 테마 색상, 모달 헤더 개편)\n2. 훅 — 출근 메시지에서 daily_goal 추출\n3. 2026-05-17 노트 재생성 (새 포맷)\n\n캘린더: 8컬럼 (주간목표 열 + 7요일), 테마별 색상 (5/17은 연분홍 = 호흡 조절)\n모달: 상단에 날짜/출퇴근 시각/오늘의 목표 → 3줄 요약 → Q&A/코드/인사이트 순서"}, {"q_original": "글씨 크기를 더 키워주고, 어제자 연구노트는 아직도 보이지 않아. 이 부분 수정해줘.", "a_summary": "파일:// 프로토콜에서 fetch() 차단 문제 해결. 모든 노트 데이터를 JSON 형식으로 HTML 내부에 직접 임베드하여 로컬 환경에서 작동 가능하게 변경. 동시에 CSS 폰트 크기 전체 확대.", "a_original": "브라우저 캐시 문제일 수 있으니 데이터 디렉토리도 확인합니다. 두 JSON 파일 모두 존재합니다. 문제는 `file://` URL로 열면 브라우저가 `fetch()` 요청을 보안상 차단하기 때문입니다. 노트 데이터를 HTML에 직접 임베드하도록 수정 + 폰트 크기 증가 동시에 처리합니다. 핵심 변경: `fetch('./data/...')` → `const NOTES_DATA = {...}` 임베드 방식으로 교체."}, {"q_original": "이 HTML 파일을 어디서나 웹과 핸드폰에서 확인할 수 있도록 하려면 어떻게 해야해?", "a_summary": "GitHub Pages(추천), Netlify, Cloudflare Pages 세 가지 방안 제시. GitHub Pages 선택 후 `KChaeYeon/Research_Note` repo 생성 → gh CLI 인증 → 자동 배포 완료. URL: https://kchaeyeon.github.io/Research_Note/", "a_original": "크게 세 가지 방법이 있고, 상황에 맞게 하나를 선택하면 됩니다. ---## 방법 1: GitHub Pages (추천, 무료) **조건**: GitHub 계정 필요, public repo (또는 GitHub Pro) **설정:** ```bash # 1. research_notes 폴더를 GitHub repo로 push cd /mnt/d/00_Project/research_notes git remote add origin https://github.com/[아이디]/research-notes.git git push -u origin master # 2. GitHub → repo Settings → Pages → Source: master branch → Save ``` **결과 URL**: `https://[아이디].github.io/research-notes/Chaeyeon%27s_Research_Note.html`"}, {"q_original": "핸드폰으로 앱 형식으로 볼 수 있게 APK 파일로 만들 수 있어?", "a_summary": "APK는 가능하지만 매번 수동 업데이트 필요. PWA(Progressive Web App) 추천 - manifest.json + Service Worker 추가로 홈화면 아이콘 설치 후 앱처럼 실행. GitHub 업데이트 자동 반영, 오프라인 캐시 지원.", "a_original": "세 가지 옵션을 비교해 설명할게. --- **옵션 비교** | 방식 | 난이도 | 결과 | 추천도 | |------|--------|------|--------| | **GitHub Pages 모바일 브라우저** | 이미 완료 | URL 접속, 북마크 | ★★★ | | **PWA (Progressive Web App)** | 쉬움 | 홈 화면에 앱 아이콘, 오프라인 가능 | ★★★★★ | | **APK (TWA/WebView 앱)** | 복잡 | 진짜 .apk 파일 | ★★ |"}, {"q_original": "퇴근 후 자동으로 모바일 앱이나 웹에서도 업데이트가 자동으로 되는거야? 캐시 삭제 같은 거 안 해도?", "a_summary": "자동 업데이트 됨. Service Worker를 Network-first 전략으로 설정해 앱 열 때마다 서버에서 최신 파일 먼저 가져옴. GitHub CDN 캐시 5~10분 예외 있음.", "a_original": "**결론: 자동으로 돼. 캐시 삭제 불필요.** --- 흐름을 설명하면: ``` 퇴근 입력   → generate_note.py 실행 (노트 생성 + index.html 재생성)   → git push → GitHub Pages 업데이트   → 앱/브라우저에서 열 때 자동으로 최신 index.html 가져옴 ``` Service Worker를 **Network-first** 전략으로 설정했기 때문에, 앱을 열 때마다 인터넷이 있으면 항상 서버에서 최신 파일을 먼저 받아와."}, {"q_original": "여기서 이야기해도 daily 연구노트에 자동으로 업데이트 되도록 인식되는거지?", "a_summary": "현재는 '출근'/'퇴근' 키워드 트리거 방식. 일반 대화는 노트에 반영 안 됨. generate_note.py가 세션 JSONL 로그 전체를 읽으면 퇴근 시 오늘 전체 대화 자동 반영됨. 검증 필요.", "a_original": "확인해보니, **자동 업데이트는 '출근' / '퇴근' 키워드 트리거 방식**입니다. 평소 대화 내용이 실시간으로 노트에 쌓이는 구조는 **아닙니다**. ## 🔍 현재 동작 방식 `~/.claude/hooks/research_note_hook.sh` 가 `UserPromptSubmit` 이벤트에 걸려있고, 프롬프트에 특정 키워드가 있을 때만 작동합니다."}], "code_highlights": ["Python generate_note.py: theme 자동 분류 로직 추가 (RSP_hemodynamics→'rsp', Sleep_InfraSlow_RSP→'sleep' 등), summary_3lines 필드 생성", "Hook script: 출근 메시지 정규식 파싱으로 '출근 - [목표]' 형식에서 daily_goal 추출", "HTML: `<script>const NOTES_DATA = {...}<\/script>` 형태로 모든 노트를 임베드, NOTES_META 대신 NOTES_DATA 사용", "PWA 설정: manifest.json(앱 메타데이터), sw.js(Service Worker Network-first 캐싱 전략)", "HTML 템플릿: 테마별 탭 구조 추가 (renderModalNote 함수 재작성, 4개 탭 자동 생성)", "CSS 그리드: 캘린더 날짜 열 minmax(0, 1fr)로 동일 너비 유지, 주간목표 열 160px 확장", "자동 배포: git push hook + GitHub Pages CDN (5~10분 지연)"], "insights": ["file:// 프로토콜은 CORS 제약이 있어 fetch() 차단 → 데이터 임베드 방식으로 근본적 해결", "PWA는 APK보다 배포·유지보수 효율 우수. 웹 업데이트 자동 반영, 오프라인 지원, 설치 간편", "Network-first 전략은 온라인 우선 최신화, 오프라인 폴백으로 사용자 경험 최적화", "Service Worker 캐싱으로 GitHub CDN 지연 예외처리 필요 (실사용 시 5~10분 후 반영)", "일일목표 추출을 훅 단계에서 수행하면 note 생성 로직 단순화, 데이터 정규성 향상"], "date": "2026-05-17", "start_time": "20260517 16:00", "end_time": "20260518 09:16", "daily_goal": ""}, "2026-05-18": {"theme": "misc", "topics": ["공개발표회 발표자료 전체 검토 및 슬라이드별 피드백", "발표 스크립트 작성 (슬라이드 1~16 완성)", "예상 질문 32개 + 답변 HTML 제작", "스크립트 슬라이드 번호 전면 재정렬", "연구 방향 재설계", "HTML 도비일지 리디자인"], "summary_3lines": ["내일(5/19) 공개발표회 대비 — 발표자료 전체 검토, 슬라이드별 수정방향 제시, 스크립트(슬라이드 1~16) 완성 및 번호 재정렬 완료.", "예상 질문 32개(7카테고리)와 예시 답변 + 내가 채워야 할 공부 항목을 HTML 문서로 정리.", "호흡 조절 연구 novelty 부족 진단 → CSF 직접 측정의 단계적 검증 전략으로 narrative 재설계."], "qa_highlights": [{"q_original": "발표자료를 교수 시각으로 검토하여 어떤 주제이고 어느 단계인지 제시해줘.", "a_summary": "Sleep study(관찰): 수면 중 호흡-CSF infra-slow coupling 확인(논문 준비 중) → Study 1(완료): Rate×Volume 2×2 factorial, MV 180%가 CO 증가 주도(심사 중) → Study 2(진행 중): 흉식 vs 복식 호흡 메커니즘 차이. 5년차 기대 수준: 2편 이상 1저자 SCI 실적 또는 투고 완료, 명확한 졸업 타임라인 필요.", "a_original": "슬라이드 구조 분석 결과: 연구 주제는 '호흡이 뇌 청소(glymphatic) 시스템을 촉진할 수 있는가'. 수면 관찰 연구로 시작해 각성 시 능동적 호흡 조절로 확장하는 단계적 구조. 5년차(9학기)에서 교수진 기대치는 최소 1~2편 실적, 논문 준비 상태 가시화."}, {"q_original": "호흡 조절에 따른 심혈관계 지표 변화 연구가 정말 필요한가? 교수님이 왜 해야 하는지 모르겠다고 하셨어.", "a_summary": "현재 연구는 proxy의 proxy 구조로 임팩트가 약함. CSF 직접 측정 어려움(MRI 품질 이슈) → cardiac output이 respiration-CSF 경로의 중간 단계로 실용적 대리 지표. 최종적으로는 MRI로 CSF dynamics 직접 검증하는 단계적 설계 필요.", "a_original": "교수님의 피드백은 연구의 proxy 문제를 정확히 짚은 것입니다. 호흡 → 심혈관 변화는 glymphatic system에 대한 간접 지표일 뿐이고, 기존 문헌에도 이미 많이 보고된 내용입니다. 진짜 질문은 \"호흡이 뇌 청소를 어떻게 바꾸는가\"인데 측정하는 것은 \"호흡이 심박수를 어떻게 바꾸는가\"입니다."}, {"q_original": "그럼 지금 상태에서, 뇌 청소 시스템 촉진을 위한 호흡 조절이라는 큰 틀에서 어떻게 연구 방향을 수정할 수 있을까?", "a_summary": "5가지 방향 검토 결과 추천: ① PET study 중심축 (협업연구실) ② 장기 호흡 훈련 도구 개발 (HRV 기반 적응형) ③ 혈중 plasma Aβ 측정 ④ 초음파 TCD pulsatility. 측정 자원의 제약을 고려하면 호흡 훈련 도구 + 혈중 Aβ 조합이 현실적.", "a_original": "기존 호흡 앱(Calm, Breathe+)과의 차별화: ① 실제 호흡 파형 측정·피드백 ② HRV 기반 개인화 적응 ③ 뇌 청소 촉진 목적 ④ 혈중 Aβ로 생물학적 검증. 이 네 가지가 논문에서 novelty 주장의 근거가 됩니다."}, {"q_original": "슬라이드 10번에서 심혈관계 지표를 보는 이유를 스크립트에 자연스럽게 포함시키려면?", "a_summary": "메커니즘 재설명 → cardiac output이 respiration-CSF 경로의 핵심 중간 단계임을 명시 → 심혈관계 지표를 비침습적·실시간 측정 가능한 대리 지표로 사용한다고 설명. 이렇게 하면 CSF 언급과의 논리적 단절 해결.", "a_original": "cardiac output은 respiration → CSF 경로의 중간 단계입니다. 즉, cardiac output을 측정하는 것은 이 경로를 비침습적으로 실시간 검증할 수 있는 실용적 대리 지표입니다(CSF 측정은 MRI 필요)."}], "code_highlights": ["예상질문_답변정리.html 신규 생성 — 7카테고리 32문항, sidebar 네비게이션, 긴급도 badge(🔴/🟠/🟢), 키워드 태그, 표 포함", "발표스크립트.txt 슬라이드 번호 전면 재정렬: [13]→[11], [14]→[12], [15]→[13], [16]→[14], [17]→[15] (Study 1 백업 슬라이드 17~18 이동 반영)", "발표스크립트.txt [슬라이드 14] 측정장비 수정: flowmeter → 'NICO(비침습 심박출량 측정기)와 심전도(ECG)'", "발표스크립트.txt [슬라이드 16] THANK YOU 슬라이드 스크립트 신규 추가", "research_notes HTML: 제목 섹션 다크 테마(네이비 그라데이션) + 생존일 카운터(2022.03.02~현재)", "generate_note.py: advisor_session 토글 추가 (기존 기타 탭에 5개 아코디언 통합)"], "insights": ["Q29(왜 CSF 직접 측정 안 하나)가 전체 연구의 가장 취약한 논리 연결 지점 — 발표 중 슬라이드 10에서 선제적으로 차단 가능", "glymphatic controversy(2022~2025 비판 논문) 2~3편은 내일 발표 전 반드시 파악 필수 — 기반 이론 자체 질문 대비", "%RIC threshold 수치, PAC metric 이름+통계 검정 방법은 내일 즉답해야 할 구체적 숫자/이름 — 오늘 밤 확인 필수", "proxy 연구의 임팩트는 최종 outcome의 직접성에 따라 결정됨. 심혈관 지표는 약하지만 단계적 MRI 검증 계획이 있으면 설득력 있음.", "슬라이드 번호 불일치는 구조 변경 시 연동 파일을 동시에 업데이트하지 않아 발생 — 향후 PPTX 구조 바꿀 때 스크립트 번호도 함께 확인"], "files_modified": [{"path": "/mnt/d/00_Project/20260519_공개발표회/예상질문_답변정리.html", "action": "생성", "type": "HTML", "description": "7카테고리 32문항 예상 Q&A — 긴급도 badge(🔴필수 10·🟠권장 14·🟢기본 7), sidebar 네비게이션, 키워드 태그, Q28·Q29 pre-open"}, {"path": "/mnt/d/00_Project/20260519_공개발표회/20260519_공개발표회_발표스크립트.txt", "action": "수정", "type": "Text", "description": "슬라이드 번호 재정렬(13→11, 14→12, 15→13, 16→14, 17→15), flowmeter→NICO, 슬라이드 10·15 스크립트 수정, 슬라이드 16 THANK YOU 신규 let currentYear, currentMonth;

function getISOWeekKey(year, month, day) {
  const d = new Date(Date.UTC(year, month, day));
  d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
  const ys = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  const w = Math.ceil((((d - ys) / 86400000) + 1) / 7);
  return `${d.getUTCFullYear()}-W${String(w).padStart(2, '0')}`;
}

function init() {
  const t = new Date();
  currentYear = t.getFullYear();
  currentMonth = t.getMonth();
  renderCalendar();
}

function renderCalendar() {
  document.getElementById('month-label').textContent = `${currentYear}년 ${currentMonth + 1}월`;
  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';

  const wh = document.createElement('div');
  wh.className = 'cal-week-header';
  wh.textContent = '주간 목표';
  grid.appendChild(wh);

  ['일','월','화','수','목','금','토'].forEach(d => {
    const h = document.createElement('div');
    h.className = 'cal-day-name';
    h.textContent = d;
    grid.appendChild(h);
  });

  const firstDay = new Date(currentYear, currentMonth, 1).getDay();
  const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
  const today = new Date();

  const slots = [];
  for (let i = 0; i < firstDay; i++) slots.push(null);
  for (let d = 1; d <= daysInMonth; d++) slots.push(d);
  while (slots.length % 7 !== 0) slots.push(null);

  for (let w = 0; w < slots.length; w += 7) {
    const week = slots.slice(w, w + 7);
    const firstNonNull = week.find(d => d !== null);
    const monday = week[1]; // ISO weeks start Monday; use Monday for weekKey alignment
    const keyDay = (monday !== null && monday !== undefined) ? monday : firstNonNull;
    const weekKey = keyDay ? getISOWeekKey(currentYear, currentMonth, keyDay) : '';

    const goalCell = document.createElement('div');
    goalCell.className = 'cal-week-goal';
    const goalText = WEEKLY_GOALS[weekKey] || '';
    goalCell.innerHTML = goalText
      ? `<span class="week-goal-text">${escHtml(goalText)}</span>`
      : `<span class="week-goal-empty">목표 없음</span>`;
    grid.appendChild(goalCell);

    week.forEach(dayNum => {
      if (dayNum === null) {
        const blank = document.createElement('div');
        blank.className = 'cal-cell empty';
        grid.appendChild(blank);
        return;
      }
      const dateStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;
      const cell = document.createElement('div');
      cell.className = 'cal-cell';

      if (currentYear === today.getFullYear() && currentMonth === today.getMonth() && dayNum === today.getDate())
        cell.classList.add('today');

      const noteInfo = NOTES_META[dateStr];
      const theme = noteInfo ? (noteInfo.theme || 'misc') : null;

      if (noteInfo) {
        cell.classList.add('has-note', `theme-${theme}`);
        cell.onclick = () => openNote(dateStr);
      }

      const numEl = document.createElement('div');
      numEl.className = 'day-num';
      numEl.textContent = dayNum;
      cell.appendChild(numEl);
      if (cell.classList.contains('today')) {
        const zEl = document.createElement('div');
        zEl.className = 'today-zombie';
        zEl.textContent = '🧟';
        cell.appendChild(zEl);
      }

      if (noteInfo) {
        const kwList = document.createElement('div');
        kwList.className = 'kw-list';
        (noteInfo.topics || []).slice(0, 3).forEach(kw => {
          const tag = document.createElement('span');
          tag.className = 'kw-tag';
          tag.textContent = kw;
          kwList.appendChild(tag);
        });
        cell.appendChild(kwList);
      }

      grid.appendChild(cell);
    });
  }
}

function openNote(dateStr) {
  document.getElementById('modal-backdrop').classList.add('open');
  const note = NOTES_DATA[dateStr];
  if (note) {
    renderModalNote(note);
  } else {
    document.getElementById('modal-content').innerHTML = '<div class="loading">노트를 불러올 수 없습니다.</div>';
  }
}

  document.getElementById('modal-content').innerHTML = `
    <div class="modal-header" style="background:linear-gradient(140deg,${tc.bg} 0%,#fff 65%);border-left:4px solid ${tc.accent}">
      <span class="modal-theme-badge" style="background:${tc.accent}">${escHtml(tc.label)}</span>
      <div class="modal-date">${dateLabel}</div>
      <div class="modal-time">⏰ ${escHtml(note.start_time||'')} ~ ${escHtml(note.end_time||'')}</div>
      ${note.daily_goal ? `<div class="modal-goal">🎯 ${escHtml(note.daily_goal)}</div>` : ''}
      <div class="topic-tags">${topics}</div>
    </div>
    <div class="theme-tabs">${tabsHtml}</div>
    ${panelsHtml}`;
}

function switchTab(themeKey) {
  document.querySelectorAll('.theme-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.theme-panel').forEach(p => p.classList.remove('active'));
  const tab = document.querySelector(`.theme-tab[onclick="switchTab('${themeKey}')"]`);
  if (tab) tab.classList.add('active');
  const panel = document.getElementById(`panel-${themeKey}`);
  if (panel) panel.classList.add('active');
}

function closeModal(e) { if (e.target === document.getElementById('modal-backdrop')) closeModalDirect(); }
function closeModalDirect() { document.getElementById('modal-backdrop').classList.remove('open'); }
function toggleOrig(i) {
  const el = document.getElementById(`qa-orig-${i}`);
  el.style.display = el.style.display === 'block' ? 'none' : 'block';
}
function toggleAdvisor(idx) {
  const body = document.getElementById('adv-body-' + idx);
  const btn = document.getElementById('adv-btn-' + idx);
  const isOpen = body.style.display === 'block';
  body.style.display = isOpen ? 'none' : 'block';
  btn.classList.toggle('open', !isOpen);
}
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.getElementById('prev-month').onclick = () => {
  if (--currentMonth < 0) { currentMonth = 11; currentYear--; }
  renderCalendar();
};
document.getElementById('next-month').onclick = () => {
  if (++currentMonth > 11) { currentMonth = 0; currentYear++; }
  renderCalendar();
};
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModalDirect(); });

init();

(function(){
  var start = new Date('2022-03-02');
  var days = Math.floor((new Date() - start) / 86400000);
  var el = document.getElementById('badge-survival');
  if(el) el.textContent = '🎓 5년차 생존자 +' + days + '일';
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}
</script>
</body>
